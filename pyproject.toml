# SPDX-License-Identifier: Apache-2.0
# Packaging for the framework-agnostic `dn_mopd` package only. The trainer fork (miles/), the evaluation code (eval/)
# and the recipes are not part of this distribution; they are used from the repository checkout.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dn-mopd"
version = "0.1.0"
description = "Domain-normalized multi-teacher on-policy distillation (DN-MOPD): per-domain advantage multipliers and the clipped OPD loss, for any PyTorch trainer"
readme = "dn_mopd/README.md"
license = {text = "Apache-2.0"}
authors = [{name = "The DN-MOPD authors"}]
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]
keywords = ["on-policy distillation", "knowledge distillation", "reinforcement learning", "LLM", "multi-teacher"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://lixin.ai/DN-MOPD"
Repository = "https://github.com/LiXin97/DN-MOPD"

[tool.setuptools.packages.find]
include = ["dn_mopd", "dn_mopd.*"]

[tool.setuptools.package-data]
dn_mopd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
